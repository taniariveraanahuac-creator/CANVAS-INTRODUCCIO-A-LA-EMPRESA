<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Lab ADM1401 · Casos reales de la región</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1433; --navy2:#003366; --orange:#E87722; --cream:#FFF8EE; --ink:#1d2340; --muted:#5d6480;
  --line:#e3e6f0; --bg:#f4f6fb; --ok:#1f9d55; --warn:#d97706; --bad:#c2410c; --card:#fff;
  --b1:#E87722; --b2:#2563eb; --b3:#0891b2; --b4:#db2777; --b5:#16a34a; --b6:#7c3aed; --b7:#ea580c; --b8:#0d9488; --b9:#b91c1c;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15.5px;line-height:1.5}
h1,h2,h3,h4{font-family:'Baloo 2',sans-serif;line-height:1.15;margin:.2em 0 .4em}
h1{font-size:2rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
button{font-family:inherit;font-size:.95rem;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:.95rem;color:var(--ink)}
a{color:var(--navy2)}
.hidden{display:none!important}

/* header */
header.top{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--orange);display:grid;place-items:center;font-size:24px}
.brand b{font-family:'Baloo 2';font-size:1.25rem;display:block;line-height:1}
.brand small{opacity:.8;font-size:.78rem}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.82rem;border:0}
.pill.light{background:rgba(255,255,255,.14);color:#fff}
.pill.light:hover{background:rgba(255,255,255,.25)}
.status{background:#fff;color:var(--navy);}
.status.saving{background:#fef3c7}
.status.local{background:#ffedd5}
.status.cloud{background:#dcfce7}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:6px 10px;overflow-x:auto;position:sticky;top:66px;z-index:30}
nav.tabs a{text-decoration:none;color:var(--muted);font-weight:800;padding:8px 14px;border-radius:12px;white-space:nowrap;font-size:.92rem}
nav.tabs a.on{background:var(--navy);color:#fff}
nav.tabs a:hover:not(.on){background:var(--bg)}
main{max-width:1280px;margin:0 auto;padding:20px 16px 80px}

/* cards & callouts */
.card{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:0 1px 3px rgba(11,20,51,.08);border:1px solid var(--line);margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.callout{border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.callout .ic{font-size:1.4rem;line-height:1}
.c-dummy{background:#eef4ff;border:2px dashed #93b4f5}
.c-tip{background:#ecfdf3;border:2px solid #a7e3c0}
.c-warn{background:#fff4e6;border:2px solid #fbc78d}
.c-bee{background:#fffbea;border:2px solid #fcd34d}
.c-bad{background:#fdecec;border:2px solid #f5a3a3}
.hero{background:radial-gradient(circle at 85% 20%,#ffb46b33,transparent 40%),linear-gradient(135deg,var(--navy),#16306b);color:#fff;border-radius:22px;padding:28px 26px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h1{font-size:2.3rem;margin:0}
.hero p{max-width:760px;opacity:.95}
.hero .bee{position:absolute;right:26px;top:16px;font-size:84px;transform:rotate(-12deg)}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:800;background:var(--navy);color:#fff;display:inline-flex;gap:6px;align-items:center}
.btn:hover{filter:brightness(1.15)}
.btn.or{background:var(--orange)}
.btn.gh{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn.gh:hover{border-color:var(--navy)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:9px}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:.74rem;font-weight:800;background:var(--bg);color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 40px}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.85rem}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.92rem}
th{background:var(--bg);font-weight:800}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],textarea,select{border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--orange)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-weight:800;font-size:.86rem;margin:8px 0 4px}

/* route map */
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.route div{background:#fff;border-radius:14px;padding:12px;border:2px solid var(--line);position:relative}
.route div b{font-family:'Baloo 2';font-size:1.05rem;display:block}
.route .n{position:absolute;top:-10px;left:-6px;background:var(--orange);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:800}

/* canvas board */
.board{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:minmax(150px,auto) minmax(150px,auto) minmax(130px,auto);gap:8px}
.blk{background:#fff;border-radius:14px;border:2px solid var(--line);border-top:7px solid var(--c);padding:10px 11px;cursor:pointer;position:relative;transition:transform .12s, box-shadow .12s;display:flex;flex-direction:column;min-width:0}
.blk:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(11,20,51,.12)}
.blk.sel{outline:3px solid var(--c);outline-offset:1px}
.blk h4{margin:0;font-size:1rem;display:flex;gap:6px;align-items:center}
.blk h4 .num{background:var(--c);color:#fff;border-radius:7px;font-size:.75rem;padding:1px 7px}
.blk .q{font-size:.78rem;color:var(--muted);margin-bottom:4px}
.blk ul{margin:2px 0 0;padding-left:16px;font-size:.82rem;flex:1}
.blk ul li{margin:1px 0;overflow-wrap:anywhere}
.blk .prog{height:7px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:6px}
.blk .prog i{display:block;height:100%;background:var(--c)}
.blk .empty{font-size:.8rem;color:#9aa0b8;font-style:italic;flex:1}
.a-b8{grid-column:1/3;grid-row:1/3} .a-b7{grid-column:3/5;grid-row:1} .a-b6{grid-column:3/5;grid-row:2}
.a-b1{grid-column:5/7;grid-row:1/3} .a-b4{grid-column:7/9;grid-row:1} .a-b3{grid-column:7/9;grid-row:2}
.a-b2{grid-column:9/11;grid-row:1/3} .a-b9{grid-column:1/6;grid-row:3} .a-b5{grid-column:6/11;grid-row:3}
@media (max-width:700px){header.top{position:static}nav.tabs{top:0}.panel{position:static;max-height:none}}
@media (max-width:900px){.board{grid-template-columns:1fr;grid-template-rows:none}.board .blk{grid-column:auto!important;grid-row:auto!important}}

/* panel */
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1050px){.split{grid-template-columns:1fr}}
.panel{position:sticky;top:120px;max-height:calc(100vh - 135px);overflow:auto;border-top:8px solid var(--c)}
.ptabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.ptabs button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px 10px;font-weight:800;font-size:.82rem;color:var(--muted)}
.ptabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:2px dashed var(--c);background:#fff;border-radius:12px;padding:6px 10px;font-size:.84rem;text-align:left;font-weight:600;color:var(--ink)}
.chip:hover{background:var(--cream)}
.chip.used{opacity:.4;border-style:solid;cursor:default}
.items{list-style:none;padding:0;margin:6px 0}
.items li{background:var(--cream);border-left:5px solid var(--c);border-radius:10px;padding:7px 9px;margin:6px 0;display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.items li .t{flex:1;overflow-wrap:anywhere}
.items li .meta{font-size:.72rem;color:var(--muted)}
.items li button{border:0;background:transparent;font-size:1rem;padding:0 2px}
.checklist{list-style:none;padding:0;margin:4px 0}
.checklist li{padding:3px 0;font-size:.9rem}
.ex{background:#f7f8fc;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.9rem}
.ex h5{margin:0 0 4px;font-size:.92rem}
.ex ul{margin:0;padding-left:18px}

/* teams */
.team{border-top:7px solid var(--tc,#0B1433)}
.team ol{margin:6px 0 0;padding-left:20px}
.member{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line);font-size:.9rem}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-weight:800;text-align:center;font-size:.8rem;color:var(--muted)}
.cal .d{min-height:62px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;font-size:.75rem}
.cal .d.o{background:transparent;border:0}
.cal .d.today{border:2px solid var(--orange)}
.cal .d .ev{background:var(--navy);color:#fff;border-radius:6px;padding:1px 4px;margin-top:2px;font-size:.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .d .ev.dl{background:var(--bad)}

/* rubric */
.rub td,.rub th{font-size:.84rem}
.lv{border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:#fff}
.lv.on{border-color:var(--orange);background:#fff4e6}
.lvl4{color:#15803d}.lvl3{color:#2563eb}.lvl2{color:#d97706}.lvl1{color:#b91c1c}
.bigscore{font-family:'Baloo 2';font-size:2.4rem;font-weight:800;color:var(--navy)}

/* progress ring */
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p)*1%),#e8ebf3 0);display:grid;place-items:center}
.ring span{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-family:'Baloo 2';font-size:1.1rem}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(11,20,51,.55);z-index:100;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:22px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.tour-ill{font-size:64px;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--orange)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:120;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw}
#toast.on{opacity:1}

/* report scoped */
.rep{font-family:'Nunito',Arial,sans-serif;color:#1d2340;background:#fff;padding:22px;border-radius:14px;border:1px solid #e3e6f0}
.rep h1{font-family:'Baloo 2',Arial;color:#0B1433;margin:0;font-size:1.7rem}
.rep h2{font-family:'Baloo 2',Arial;color:#0B1433;border-bottom:3px solid #E87722;padding-bottom:3px;margin-top:22px;font-size:1.25rem}
.rep .rhead{background:#0B1433;color:#fff;border-radius:12px;padding:14px 16px}
.rep .rhead small{opacity:.85}
.rep .rgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:8px}
.rep .rb{border:1px solid #d6dae6;border-top:5px solid #0B1433;border-radius:8px;padding:6px 7px;font-size:.76rem;min-height:90px}
.rep .rb b{display:block;font-size:.8rem;margin-bottom:2px}
.rep .rb ul{margin:0;padding-left:14px}
.rep table th,.rep table td{border:1px solid #e3e6f0;font-size:.82rem}
.rep .src{font-size:.68rem;border-radius:6px;padding:0 5px;background:#eef1f8;color:#5d6480;margin-left:4px}
.rep .kpi{display:inline-block;background:#fff4e6;border-radius:10px;padding:6px 10px;margin:3px;font-weight:800}

/* ====== REDISEÑO v3: más grande, más claro, más guiado ====== */
:root{--bg:#f3f5fa;--line:#e2e6f0;--muted:#5a6280}
body{font-size:17px;line-height:1.6;background:var(--bg)}
h1{font-size:2.15rem;letter-spacing:-.01em} h2{font-size:1.6rem} h3{font-size:1.25rem}
main{max-width:1240px;padding:24px 20px 40px}
p,li{font-size:1rem}
.card{border-radius:20px;padding:22px 24px;box-shadow:0 2px 10px rgba(11,20,51,.06);border:1px solid var(--line)}
.btn{font-size:1rem;padding:11px 18px;border-radius:14px;box-shadow:0 2px 0 rgba(0,0,0,.08);transition:transform .08s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn.sm{font-size:.9rem;padding:7px 12px;border-radius:11px}
.btn.big{font-size:1.08rem;padding:14px 22px;border-radius:16px}
th,td{font-size:.98rem;padding:10px 12px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],textarea,select{font-size:1rem;padding:11px 13px;border-radius:12px}
textarea{min-height:110px;line-height:1.5}
label.f{font-size:.95rem}
.tag{font-size:.82rem;padding:3px 10px;border-radius:999px}
.callout{font-size:1rem;padding:14px 16px;border-radius:16px}
header.top{padding:12px 22px}
.brand b{font-size:1.35rem}
/* nav: ruta numerada */
nav.tabs{display:flex;align-items:center;gap:10px;padding:8px 14px;top:66px;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(11,20,51,.04)}
nav.tabs a{text-decoration:none;font-weight:800;color:var(--muted);border-radius:12px;white-space:nowrap}
nav.tabs .home{padding:8px 12px;font-size:1rem}
nav.tabs .home.on{background:var(--navy);color:#fff}
.stepsnav{display:flex;gap:4px;flex:1;overflow-x:auto;padding:2px}
.stepsnav .st{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 7px;border-radius:999px;font-size:.98rem;border:2px solid transparent}
.stepsnav .st .sn{width:28px;height:28px;border-radius:50%;background:#e8ebf3;color:var(--muted);display:grid;place-items:center;font-size:.9rem;flex:none}
.stepsnav .st.done .sn{background:var(--ok);color:#fff}
.stepsnav .st.on{background:#fff4e6;border-color:var(--orange);color:var(--navy)}
.stepsnav .st.on .sn{background:var(--orange);color:#fff}
.stepsnav .st:hover:not(.on){background:var(--bg)}
nav.tabs .extra{display:flex;gap:2px}
nav.tabs .extra a{padding:8px 10px;font-size:.95rem}
nav.tabs .extra a.on{background:var(--navy);color:#fff}
nav.tabs .xl{display:none}
@media (min-width:1600px){nav.tabs .xl{display:inline}}
a.btn{text-decoration:none}
h1,h2,h3,h4,.rc b,.qs,.bigscore,.bignum,.lesson .ln{font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif}
.stepsnav .st{padding:6px 11px 6px 6px}
@media (max-width:900px){.stepsnav .stl{display:none}.stepsnav .st.on .stl{display:inline}}
/* encabezados de página y "¿qué hago aquí?" */
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h1{margin:0}
.howto{background:linear-gradient(135deg,#fff8ee,#fff);border:2px solid #fbd5a8;border-radius:20px;padding:14px 18px;margin-bottom:18px}
.howto .ht{font-weight:800;color:var(--orange);font-family:'Baloo 2';font-size:1.15rem;margin-bottom:6px}
.hsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.hs{display:flex;gap:10px;align-items:flex-start;font-size:1rem;font-weight:600}
.hs span{flex:none;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:800}
.nextbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:2px dashed var(--line)}
.ring.big{width:92px;height:92px}.ring.big span{width:72px;height:72px;font-size:1.35rem}
/* tarjetas de ruta */
.routecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:10px 0 20px}
.rc{position:relative;display:block;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px 18px 14px;transition:transform .12s,box-shadow .12s}
.rc:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(11,20,51,.1)}
.rc .rcn{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:#e8ebf3;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.rc .rci{font-size:2.1rem}
.rc b{font-family:'Baloo 2';font-size:1.3rem;display:block}
.rc p{margin:4px 0 10px;color:var(--muted);font-size:.98rem}
.rc .rcs{font-weight:800;font-size:.9rem;color:var(--muted)}
.rc.done{border-color:#a7e3c0;background:#f3fcf6}.rc.done .rcn{background:var(--ok);color:#fff}.rc.done .rcs{color:var(--ok)}
.rc.next{border-color:var(--orange);box-shadow:0 0 0 4px #ffe3c4}.rc.next .rcn{background:var(--orange);color:#fff}.rc.next .rcs{color:var(--orange)}
/* lecciones */
.lesson{display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px rgba(11,20,51,.05)}
.lesson .ln{flex:none;width:52px;height:52px;border-radius:16px;background:var(--navy);color:#fff;font:800 1.5rem 'Baloo 2';display:grid;place-items:center}
.lesson .lb{flex:1;min-width:0}
@media (max-width:700px){.lesson{flex-direction:column}}
.zq{border-radius:16px;padding:14px;background:color-mix(in srgb,var(--z) 10%,#fff);border:2px solid var(--z);text-align:center;font-size:1.6rem}
.zq b{display:block;font-size:1.05rem;color:var(--z)}.zq span{display:block;font-size:.88rem;color:var(--muted)}
.zones .blk .zl{font-weight:800;font-size:.85rem;margin-top:auto}
.bcard{border:2px solid var(--line);border-left:7px solid var(--c);border-radius:16px;padding:12px 14px;background:#fff}
.bcard .bch{font-weight:800;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.bcard .bch span{background:var(--c);color:#fff;border-radius:8px;padding:0 8px;font-size:.85rem}
.bcard p{margin:6px 0 0;font-size:.95rem}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.chain div{background:#f7f9ff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.95rem}
.chain i{font-style:normal;font-weight:800;color:var(--orange);font-size:1.3rem}
.quizbox{background:#f7f9ff;border-radius:18px;padding:18px;text-align:center}
.qs{font-family:'Baloo 2';font-size:1.5rem;font-weight:700;margin:10px 0 14px;color:var(--navy)}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.qo{border:2px solid var(--c);background:#fff;border-radius:14px;padding:10px;font-weight:800;color:var(--ink);font-size:.98rem}
.qo:hover:not(:disabled){background:var(--cream)}
.qo.right{background:#dcfce7;border-color:var(--ok)}.qo.wrong{background:#fee2e2;border-color:var(--bad)}
/* lienzo */
.board{gap:10px}
.blk{border-radius:16px;padding:12px 13px}

   Imita la parte de la base de datos que usa la app: doc().set/get/delete/onSnapshot,

function makeSheetDB(url){
  const cache=new Map(); const subs=new Set(); let since=0, ready=false, timer=null, failing=0;
  const segs=p=>p.split('/');
  const snapDoc=(path)=>{const c=cache.get(path);return{id:segs(path).pop(),exists:!!c,data:()=>c?JSON.parse(JSON.stringify(c.data)):undefined,metadata:{fromCache:!ready,hasPendingWrites:!!(c&&c.pending)}}};
  const inCol=(col,p)=>p.startsWith(col+'/')&&p.slice(col.length+1).indexOf('/')<0;
  function runQuery(q){let docs=[...cache.keys()].filter(p=>inCol(q.col,p)).map(snapDoc);
    if(q.order){const f=q.order,d=q.dir==='desc'?-1:1;docs.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return (x>y?1:x<y?-1:0)*d});}else docs.sort((a,b)=>a.id<b.id?-1:1);
    if(q.lim)docs=docs.slice(0,q.lim);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:!ready,hasPendingWrites:false}}}
  const sig=s=>s.docs?s.docs.map(d=>d.id+':'+((cache.get(s._p+'/'+d.id)||{}).ts||0)).join('|'):String((cache.get(s._p)||{}).ts||'x');
  function notify(force){subs.forEach(s=>{let snap;if(s.q){snap=runQuery(s.q);snap._p=s.q.col;}else{snap=snapDoc(s.path);snap._p=s.path;}const g=(s.q?'':(snap.exists?'1':'0'))+sig(snap);if(force||g!==s.last){s.last=g;try{s.cb(snap)}catch(e){console.warn(e)}}})}
  async function pull(){
    try{const r=await fetch(url+(url.includes('?')?'&':'?')+'since='+since+'&t='+Date.now());const j=await r.json();if(!j.ok)throw new Error(j.error||'error');
      let mx=since;(j.docs||[]).forEach(d=>{const ts=+d.ts;const loc=cache.get(d.path);if(loc&&loc.pending&&loc.ts>ts)return;if(d.deleted)cache.delete(d.path);else{try{cache.set(d.path,{data:JSON.parse(d.json),ts})}catch(e){}}if(ts>mx)mx=ts;});
      since=mx;const first=!ready;ready=true;failing=0;notify(first);
    }catch(e){failing++;if(!ready&&failing>=2){ready=true;notify(true);}}
    clearTimeout(timer);timer=setTimeout(pull,document.hidden?60000:15000);
  }
  async function write(op,path,data){
    const ts=Date.now();if(op==='del')cache.delete(path);else cache.set(path,{data:JSON.parse(JSON.stringify(data)),ts,pending:true});notify();
    const body=JSON.stringify({op,path,json:op==='del'?'':JSON.stringify(data)});
    let lastErr;for(let i=0;i<2;i++){try{const r=await fetch(url,{method:'POST',body});const j=await r.json();if(!j.ok)throw new Error(j.error||'error');const c=cache.get(path);if(c){c.pending=false;c.ts=j.ts;}return;}catch(e){lastErr=e;await new Promise(r=>setTimeout(r,800+Math.random()*900));}}
    throw {code:'unavailable',message:String(lastErr&&lastErr.message||lastErr)};
  }
  const whenReady=()=>new Promise(res=>{if(ready)return res();const t=setInterval(()=>{if(ready){clearInterval(t);res();}},150);});
  function docRef(path){return{id:segs(path).pop(),path,
    set:d=>write('set',path,d),update:d=>{const c=cache.get(path);return write('set',path,Object.assign({},c?c.data:{},d))},delete:()=>write('del',path),
    get:async()=>{await whenReady();return snapDoc(path)},
    onSnapshot:(cb,err)=>{const s={path,cb,err,last:null};subs.add(s);if(ready){s.last=null;notify();}return()=>subs.delete(s)},
    collection:c=>colRef(path+'/'+c)}}
  function query(q){return{
    where(){return query(q)},orderBy:(f,d)=>query({...q,order:f,dir:d}),limit:n=>query({...q,lim:n}),
    get:async()=>{await whenReady();const s=runQuery(q);return s},
    onSnapshot:(cb,err)=>{const s={q,cb,err,last:null};subs.add(s);if(ready)notify();return()=>subs.delete(s)}}}
  function colRef(col){return Object.assign(query({col}),{path:col,doc:id=>docRef(col+'/'+(id||uid())),add:async d=>{const r=docRef(col+'/'+uid());await r.set(d);return r}})}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearTimeout(timer);pull();}});
  pull();
  return{doc:docRef,collection:colRef,_sheet:true};
}

let lsTimer=null;
function persistLocal(){ clearTimeout(lsTimer); lsTimer=setTimeout(()=>{ const ok=lsSet(LS,S); if(!CLOUD.on||!CLOUD.writable){ saveMode='local'; lastSaved=Date.now(); updateStatus(); } if(!ok) toast('⚠️ Este navegador no permite guardar localmente. Usa “Exportar respaldo”.'); },250); }

const timers={}, chains={};
function cloudSet(path,getter,delay=900){
  if(!CLOUD.on||!CLOUD.writable) return;
  clearTimeout(timers[path]); pending++; updateStatus();
  timers[path]=setTimeout(()=>{
    delete timers[path];
    const data=clone(getter());
    chains[path]=(chains[path]||Promise.resolve()).then(()=>CLOUD.db.doc(path).set(data))
     .then(()=>{saveMode='cloud';lastSaved=Date.now();})
     .catch(e=>cloudErr(e,()=>CLOUD.db.doc(path).set(data)))
     .finally(()=>{pending=Math.max(0,pending-1);updateStatus();});
  },delay);
}
function cloudDel(path){ if(!CLOUD.on||!CLOUD.writable) return; (chains[path]=(chains[path]||Promise.resolve()).then(()=>CLOUD.db.doc(path).delete())).catch(e=>cloudErr(e)); }
async function cloudErr(e,retry){
  const code=e&&e.code;
  if(code==='unavailable'&&retry){ await new Promise(r=>setTimeout(r,800+Math.random()*900)); try{await retry();saveMode='cloud';lastSaved=Date.now();return;}catch(e2){} }
  if(code==='invalid_argument'||code==='not_granted'||code==='revoked'||code==='capability_disabled'||code==='capability_removed'){
    if(CLOUD.writable){ CLOUD.writable=false; toast('💾 Sin permiso de escritura en la nube: tu avance se guarda en este dispositivo.'); }
  } else if(code==='quota_exceeded'){ toast('⚠️ La base de datos está llena. Avisa a tu profesora.'); }
  saveMode='local'; persistLocal(); updateStatus();
}
function updateStatus(){
  const el=$('#status'); if(!el) return;
  el.className='pill status';
  if(pending>0){el.classList.add('saving');el.textContent='⏳ Guardando…';return;}
  const t=lastSaved?new Date(lastSaved).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'';
  if(CLOUD.on&&CLOUD.writable){el.classList.add('cloud');el.textContent='☁️ Guardado en la nube'+(t?' · '+t:'');el.title='Todo tu equipo ve los cambios en vivo.';}
  else {el.classList.add('local');el.textContent='💾 Guardado en este dispositivo'+(t?' · '+t:'');el.title='Se guarda en este navegador. Usa Reporte → Exportar respaldo para pasarlo a otra computadora.';}
}

async function initCloud(){
  updateStatus();
  if(window.claude&&typeof window.claude.use==='function'){
    try{ CLOUD.db=await window.claude.use('db'); }catch(e){CLOUD.db=null}
    try{ CLOUD.user=await window.claude.use('user'); }catch(e){CLOUD.user=null}
  }
  if(!CLOUD.db){
    let url=SYNC_URL;
    if(!url&&/^https?:/.test(location.protocol)){ try{ const r=await fetch('sync.json?t='+Date.now(),{cache:'no-store'}); if(r.ok){ const j=await r.json(); url=(j&&j.url)||''; } }catch(e){} }
    if(url){ CLOUD.db=makeSheetDB(url); CLOUD.sheet=true; }
  }
  if(!CLOUD.db){ updateStatus(); return; }
  CLOUD.on=true;
  try{ CLOUD.owner=!!(CLOUD.user&&await CLOUD.user.isOwner()); }catch(e){}
  if(CLOUD.owner&&!CLOUD.sheet&&!TKEYS){ try{ const ks=await CLOUD.db.doc('claves/main').get(); if(ks.exists){const d=ks.data(); if(d&&d.keys){TKEYS=d.keys; if(VIEW==='docente'||VIEW==='claves') render();}} }catch(e){} }
  try{ const c=CLOUD.user&&await CLOUD.user.can('data.write'); if(c===false) CLOUD.writable=false; }catch(e){}
  lastSaved=Date.now(); saveMode=CLOUD.writable?'cloud':'local'; updateStatus();
  const tmo=setTimeout(()=>toast('🌐 La nube tarda en responder; sigues trabajando y se guarda en este dispositivo.'),10000);
  CLOUD.subs.config=CLOUD.db.doc('config/main').onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(tmo);
    if(snap.exists){ const d=snap.data(); if(d&&d.config&&d.config.teams && !timers['config/main']){ if((d.config.updatedAt||0)>=(S.config.updatedAt||0)){ S.config=normalizeConfig(clone(d.config)); lsSet(LS,S); softRender('config'); } else if(CLOUD.writable){ cloudSet('config/main',()=>({config:S.config}),300); } } }
    else if(!snap.metadata.fromCache && CLOUD.writable && (S.config.updatedAt||0)>0){ cloudSet('config/main',()=>({config:S.config}),300); }
  },e=>{clearTimeout(tmo);cloudErr(e)});
  if(ME.team) subscribeTeam(ME.team);
  softRender('init');
}
function unsubscribeTeam(){ const s=CLOUD.teamSub; if(s){ s.fns.forEach(f=>{try{f()}catch(e){}}); CLOUD.teamSub=null; } }
function subscribeTeam(tid){
  if(!CLOUD.on) return;
  if(CLOUD.teamSub&&CLOUD.teamSub.tid===tid) return;
  unsubscribeTeam();
  const fns=[]; let first=true;
  fns.push(CLOUD.db.collection(`teams/${tid}/blocks`).onSnapshot(qs=>{
    const t=T(tid); const seen=new Set();
    qs.docs.forEach(d=>{ seen.add(d.id); if(d.metadata.hasPendingWrites) return; const r=d.data(); const l=t.blocks[d.id];
      if(!l||(r.updatedAt||0)>(l.updatedAt||0)){ if(timers[`teams/${tid}/blocks/${d.id}`]&&l) return; t.blocks[d.id]=clone(r); }
      else if((l.updatedAt||0)>(r.updatedAt||0)&&CLOUD.writable){ cloudSet(`teams/${tid}/blocks/${d.id}`,()=>T(tid).blocks[d.id],300); }
    });
    if(first&&!qs.metadata.fromCache&&CLOUD.writable){ Object.keys(t.blocks).forEach(k=>{ if(!seen.has(k)&&(t.blocks[k].updatedAt||0)>0) cloudSet(`teams/${tid}/blocks/${k}`,()=>T(tid).blocks[k],300); }); first=false; }
    lsSet(LS,S); softRender('blocks');
  },e=>cloudErr(e)));
  fns.push(CLOUD.db.collection(`teams/${tid}/log`).orderBy('ts','desc').limit(80).onSnapshot(qs=>{
    const t=T(tid); const remote=qs.docs.map(d=>({...d.data(),synced:true})); const ids=new Set(remote.map(r=>r.id));
    const localOnly=t.log.filter(e=>!ids.has(e.id)&&!e.synced);
    if(CLOUD.writable) localOnly.forEach(e=>CLOUD.db.collection(`teams/${tid}/log`).doc(e.id).set(e).then(()=>{e.synced=true}).catch(()=>{}));
    t.log=[...localOnly,...remote].sort((a,b)=>b.ts-a.ts).slice(0,150); lsSet(LS,S); softRender('log');
  },e=>cloudErr(e)));
  fns.push(CLOUD.db.collection(`teams/${tid}/reports`).orderBy('ts','desc').limit(40).onSnapshot(qs=>{
    const t=T(tid); const remote=qs.docs.map(d=>({...d.data(),synced:true})); const ids=new Set(remote.map(r=>r.id));
    const localOnly=t.reports.filter(e=>!ids.has(e.id)&&!e.synced);
    if(CLOUD.writable) localOnly.forEach(e=>CLOUD.db.collection(`teams/${tid}/reports`).doc(e.id).set(e).then(()=>{e.synced=true}).catch(()=>{}));
    t.reports=[...localOnly,...remote].sort((a,b)=>b.ts-a.ts).slice(0,40); lsSet(LS,S); softRender('reports');
  },e=>cloudErr(e)));
  fns.push(CLOUD.db.doc(`grades/${tid}`).onSnapshot(snap=>{ if(snap.exists&&!snap.metadata.hasPendingWrites){ const r=snap.data(); const l=S.grades[tid]; if(!l||(r.updatedAt||0)>=(l.updatedAt||0)){ S.grades[tid]=clone(r); lsSet(LS,S); softRender('grades'); } } },e=>cloudErr(e)));
  CLOUD.teamSub={tid,fns};
}

/* =========================================================
   CÁLCULOS
   ========================================================= */
function blockScore(tid,k){
  const b=(T(tid).blocks[k])||{items:[],just:''}; const items=(b.items||[]).length; const j=(b.just||'').trim();
  let s=Math.min(items/3,1)*55 + Math.min(j.length/120,1)*35 + (/\d/.test(j)?10:0);
  return Math.round(s);
}
function teamProgress(tid){
  if(!tid) return 0;
  const t=T(tid); let s=BLOCKS.reduce((a,b)=>a+blockScore(tid,b.k),0)/9*0.7;
  const sg=(t.blocks.survey&&t.blocks.survey.goal)||20; s+=Math.min(teamSurveyN(tid)/sg,1)*10;
  const c=t.blocks.calc; if(c&&c.rows&&c.rows.some(r=>num(r.price)>0)) s+=8;
  const p=t.blocks.pattern; if(p&&(p.patterns||[]).length&&(p.why||'').length>30) s+=6;
  if(p&&(p.conclusion||'').length>60) s+=6;
  return Math.min(100,Math.round(s));
}
function calcTotals(c){
  c=c||{}; const rows=(c.rows||[]).map(r=>{const price=num(r.price),vc=num(r.vc),u=num(r.units);const mu=price-vc;return{...r,price,vc,u,mu,mp:price?mu/price:0,rev:price*u,cv:vc*u,contrib:mu*u}});
  const fixed=(c.fixed||[]).reduce((a,f)=>a+num(f.amount),0); const inv=(c.inv||[]).reduce((a,f)=>a+num(f.amount),0);
  const rev=rows.reduce((a,r)=>a+r.rev,0), cv=rows.reduce((a,r)=>a+r.cv,0), contrib=rev-cv, util=contrib-fixed;
  const cr=rev?contrib/rev:0; const be=cr>0?fixed/cr:Infinity; const payback=(util>0&&inv>0)?inv/util:Infinity;
  return {rows,fixed,inv,rev,cv,contrib,util,cr,be,payback};
}
function gradeOf(levels){ if(!levels) return null; let s=0,any=false; RUBRIC.forEach(r=>{const l=levels[r.id]; if(l!=null&&l!==''){any=true; s+=r.w*LVL[l].p;}}); return any?Math.round(s)/10:null; }

/* =========================================================
   COACH KAB (revisión automática por bloque)
   ========================================================= */
function coach(tid,k){
  const b=blk(tid,k), def=BMAP[k], out=[]; const items=b.items||[]; const j=(b.just||'').trim();
  if(items.length===0) out.push(['bad','Este bloque está vacío. Empieza con el tutorial 👆 y agrega al menos 3 elementos.']);
  else if(items.length<3) out.push(['warn',`Llevan ${items.length} elemento(s). Lo ideal son 3 o más.`]);
  else out.push(['ok',`¡Bien! ${items.length} elementos en el bloque.`]);
  const PR=getProps(caseIdOf(tid),k);
  const traps=items.filter(i=>i.src==='prop'&&PR.some(p=>p.t===i.t&&!p.fit));
  traps.forEach(i=>{const p=PR.find(p=>p.t===i.t); out.push(['bad',`🤔 “${i.t}” — ¿seguro que encaja? ${p.why}`]);});
  if(['b1','b2','b3','b5'].includes(k)&&teamSurveyN(tid)===0) out.push(['warn','Todavía no tienen respuestas de su encuesta 📊. Los datos propios hacen más fuerte la justificación.']);
  const own=items.filter(i=>i.src!=='prop').length;
  if(items.length>=3&&own===0) out.push(['warn','Todas sus ideas vienen de las propuestas. Agreguen al menos UNA idea propia del equipo: eso cuenta en la rúbrica.']);
  if(own>0) out.push(['ok',`Tienen ${own} idea(s) propia(s). 👏`]);
  if(!j) out.push(['bad','Falta la justificación: ¿POR QUÉ eligieron esto? Escriban 2 o 3 oraciones.']);
  else{ if(j.length<80) out.push(['warn','La justificación es muy corta; expliquen el porqué con más detalle.']); if(!/\d/.test(j)) out.push(['warn','Incluyan al menos un DATO del caso (número, %, $) en la justificación.']); else out.push(['ok','La justificación usa datos. ✔️']); }
  if(!b.owner) out.push(['warn','Asignen un responsable del bloque.']);
  const has=x=>(T(tid).blocks[x]?.items||[]).length>0;
  if(k==='b2'&&!has('b1')) out.push(['warn','Tip: la propuesta de valor (1) y los segmentos (2) se diseñan juntos.']);
  if(k==='b3'&&!has('b2')) out.push(['warn','Primero definan los segmentos (2): cada canal debe llegar a un segmento.']);
  if((k==='b5'||k==='b9')){ const c=T(tid).blocks.calc; if(!c||!(c.rows||[]).some(r=>num(r.price)>0)) out.push(['warn','Lleven sus precios y costos a la pestaña 🧮 Números para comprobar que el modelo deja ganancia.']); }
  if(k==='b9'&&!has('b6')) out.push(['warn','Los costos salen de los recursos (6), actividades (7) y aliados (8). Revísenlos.']);
  return out;
}

const NO_CHECK=['equipos','caso'];
function stepDone(v){ return NO_CHECK.includes(v)?false:realDone(v); }
function realDone(v){
  const tid=ME.team; const t=tid?T(tid):null;
  if(v==='equipos') return !!tid&&!!teamById(tid)&&teamById(tid).members.length>0;
  if(v==='aprende') return (lsGet('canvaslab-quiz')||0)>=7;
  if(!tid) return false;
  if(v==='caso') return !!lsGet('canvaslab-seen-caso-'+tid);
  if(v==='encuesta') return teamSurveyN(tid)>=((t.blocks.survey&&t.blocks.survey.goal)||20);
  if(v==='canvas') return BLOCKS.every(b=>blockScore(tid,b.k)>=70);
  if(v==='numeros'){const c=t.blocks.calc;return !!(c&&c.rows&&c.rows.some(r=>num(r.price)>0&&num(r.units)>0));}
  if(v==='patron'){const p=t.blocks.pattern;return !!(p&&(p.patterns||[]).length&&(p.conclusion||'').length>60);}
  if(v==='reporte') return t.reports.some(r=>!r.auto);
  return false;
}

after.aprende=()=>{
  $('#main').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.qa&&!QZ.picked){QZ.picked=b.dataset.qa;if(QZ.picked===QUIZ[QZ.i].a)QZ.score++;render();$('#quiz').scrollIntoView({block:'start'});}
    if(b.id==='qzNext'){QZ.i++;QZ.picked=null;if(QZ.i>=QUIZ.length){const best=lsGet('canvaslab-quiz')||0;if(QZ.score>best)lsSet('canvaslab-quiz',QZ.score);}render();$('#quiz').scrollIntoView({block:'start'});}
    if(b.id==='qzAgain'){QZ={i:0,score:0,picked:null};render();$('#quiz').scrollIntoView({block:'start'});}
  };
};

function tabulate(q,resps,man){
  const ans=resps.map(r=>r.answers[q.id]).filter(a=>a!==undefined&&a!==''&&!(Array.isArray(a)&&!a.length)); let n=ans.length; man=man||null;
  if(q.type==='single'||q.type==='multi'){ const cnt=(q.opts||[]).map(o=>ans.filter(a=>Array.isArray(a)?a.includes(o):a===o).length);
    if(man&&man.cnt){ const add=man.cnt.map(c=>Math.max(0,+c||0)); add.forEach((c,i)=>{if(i<cnt.length)cnt[i]+=c}); n+=q.type==='single'?add.reduce((x,c)=>x+c,0):(add.some(c=>c>0)?Math.max(+man.n||0,Math.max(...add)):0); }
    return {n,cnt,pct:cnt.map(c=>n?c/n:0)}; }
  if(q.type==='scale'){ const nums=ans.map(Number).filter(x=>x>=1&&x<=5); const cnt=[1,2,3,4,5].map(v=>nums.filter(x=>x===v).length); if(man&&man.cnt) man.cnt.forEach((c,i)=>{if(i<5)cnt[i]+=Math.max(0,+c||0)}); const tot=cnt.reduce((x,c)=>x+c,0); const avg=tot?cnt.reduce((x,c,i)=>x+c*(i+1),0)/tot:0; return {n:tot,avg,cnt,pct:cnt.map(c=>tot?c/tot:0)}; }

  return `<div class="pagehead"><div><h1>📊 Encuesta del equipo</h1><div class="muted">Datos propios para justificar su Canvas</div></div></div>

after.encuesta=()=>{
  if(!ME.team) return; const tid=ME.team, sv=surveyOf(tid);
  const saveSv=()=>touchBlock(tid,'survey');
  $('#main').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.svtab){SVTAB=b.dataset.svtab;render();}
    if(b.id==='qAdd'){sv.questions.push({id:'q'+uid(),q:'Nueva pregunta',type:'single',opts:['Opción 1','Opción 2'],b:'b2'});saveSv();addLog(tid,'📝 Agregó una pregunta a la encuesta');render();}
    if(b.dataset.qdel!=null){openConfirm('¿Quitar esta pregunta? Las respuestas que ya tiene dejarán de mostrarse.',()=>{sv.questions.splice(+b.dataset.qdel,1);saveSv();render();});}
    if(b.id==='qReset'){openConfirm('¿Restablecer el cuestionario de la plantilla del caso? Las respuestas capturadas a preguntas eliminadas dejarán de mostrarse.',()=>{delete T(tid).blocks.survey;const n=surveyOf(tid);n.updatedAt=Date.now();touchBlock(tid,'survey',{log:'↺ Restableció el cuestionario'});render();});}
    if(b.id==='qDl'){downloadFile(`Encuesta_${CASES[caseIdOf(tid)].name.replace(/[^A-Za-z0-9]+/g,'_')}.html`,surveyPrintable(tid),'text/html');}
    if(b.id==='tplDl'||b.id==='tplDl2'){downloadFile('Plantilla_encuesta.csv',toCSV([sv.questions.map((q,i)=>`${i+1}. ${q.q}`)]),'text/csv');}
    if(b.id==='resDl'){const RR=responses(tid);const rows=[['Pregunta','Bloque','Opción','Personas','Porcentaje','n']];sv.questions.forEach(q=>{const r=tabulate(q,RR,MAN(sv,q));if(q.type==='open')(r.list||[]).forEach(a=>rows.push([q.q,(BMAP[q.b]||BMAP.b1).n,a,'','',r.n]));else if(q.type==='scale'){[1,2,3,4,5].forEach((v,i)=>rows.push([q.q,(BMAP[q.b]||BMAP.b1).n,String(v),r.cnt[i],Math.round(r.pct[i]*100)+'%',r.n]));rows.push([q.q,(BMAP[q.b]||BMAP.b1).n,'Promedio',r.avg.toFixed(2),'',r.n]);}else q.opts.forEach((o,i)=>rows.push([q.q,(BMAP[q.b]||BMAP.b1).n,o,r.cnt[i],Math.round(r.pct[i]*100)+'%',r.n]));});downloadFile('Resultados_encuesta.csv',toCSV(rows),'text/csv');}
    if(b.id==='rDl'){const RR=responses(tid);downloadFile('Respuestas_encuesta.csv',toCSV([['#','Fecha','Capturó','Lugar',...sv.questions.map(q=>q.q)],...RR.map((r,i)=>[i+1,new Date(r.ts).toLocaleString('es-MX'),r.by||'',r.place||'',...sv.questions.map(q=>{const a=r.answers[q.id];return Array.isArray(a)?a.join('; '):(a??'')})])]),'text/csv');}
    if(b.id==='manSave'){const man={};document.querySelectorAll('[data-mq]').forEach(box=>{const q=sv.questions.find(x=>x.id===box.dataset.mq);if(!q)return;if(q.type==='open'){const l=box.querySelector('[data-mlist]').value.split('\n').map(x=>x.trim()).filter(Boolean);if(l.length)man[q.id]={list:l};}else{const c=[...box.querySelectorAll('[data-mc]')].map(i=>Math.max(0,parseInt(i.value)||0));if(c.some(x=>x>0))man[q.id]={cnt:c,n:+$('#manN').value||0};}});sv.manual=man;sv.manualN=Math.max(0,parseInt($('#manN').value)||0);touchBlock(tid,'survey',{log:`🧮 Insertó totales de ${sv.manualN} encuestas en papel`});toast('💾 Totales guardados');SVTAB='res';render();}
    if(b.id==='csvGo'&&CSVBUF){let k=0;CSVBUF.forEach(a=>{const key='r_'+uid();T(tid).blocks[key]={answers:a,by:(ME.name||'')+' (archivo)',place:'Importado de archivo',ts:Date.now()+k,updatedAt:0};touchBlock(tid,key);k++;});addLog(tid,`📥 Insertó ${CSVBUF.length} respuestas desde un archivo`);toast(`📥 ${CSVBUF.length} respuestas insertadas`);CSVBUF=null;SVTAB='res';render();}
    if(b.id==='qCopy'){const C=CASES[caseIdOf(tid)];copyText(`Encuesta · ${C.full} · ADM1401 Universidad Anáhuac Cancún\nEstamos haciendo un trabajo escolar. Es anónima y voluntaria.\n\n`+sv.questions.map((q,i)=>`${i+1}. ${q.q}\n`+(q.type==='single'||q.type==='multi'?q.opts.map(o=>`   ( ) ${o}`).join('\n')+(q.type==='multi'?'\n   (puede elegir varias)':''):q.type==='scale'?'   1  2  3  4  5  (1 = nada, 5 = mucho)':'   ______________________________')).join('\n\n'));}
    if(b.dataset.useins!=null){const q=sv.questions[+b.dataset.useins];const ins=insight(q,tabulate(q,responses(tid),MAN(sv,q)));const bl=blk(tid,q.b||'b1');bl.just=((bl.just||'').trim()+(bl.just?' ':'')+ins).trim();touchBlock(tid,q.b||'b1',{log:`📊 Llevó un dato de la encuesta al bloque ${BMAP[q.b||'b1'].n}`});toast(`➕ Dato agregado a la justificación del bloque ${BMAP[q.b||'b1'].n}`);}
    if(b.dataset.rdel){openConfirm('¿Eliminar esta respuesta?',()=>{const r=T(tid).blocks[b.dataset.rdel];r.deleted=true;touchBlock(tid,b.dataset.rdel,{log:'🗑️ Eliminó una respuesta de la encuesta'});render();});}
  };
  $('#main').oninput=e=>{const el=e.target;
    if(el.id==='svGoal'){sv.goal=Math.max(5,parseInt(el.value)||20);saveSv();return;}
    const box=el.closest('[data-qi]'); if(!box||!el.dataset.qf) return; const q=sv.questions[+box.dataset.qi];
    if(el.dataset.qf==='opts') q.opts=el.value.split('\n').map(x=>x.trim()).filter(Boolean); else q[el.dataset.qf]=el.value;
    saveSv();
  };
  $('#main').onchange=e=>{const el=e.target; if(el.dataset&&el.dataset.qf==='type'){const q=sv.questions[+el.closest('[data-qi]').dataset.qi]; if((q.type==='single'||q.type==='multi')&&!(q.opts||[]).length) q.opts=['Opción 1','Opción 2']; saveSv(); render();}};
  const ci=$('#csvIn'); if(ci) ci.onchange=async()=>{const f=ci.files[0];if(!f)return;const txt=await f.text();const res=importCSV(txt,sv);CSVBUF=res.rows.length?res.rows:null;$('#csvPrev').innerHTML=res.rows.length?`✅ Se reconocieron <b>${res.mapped}</b> de ${sv.questions.length} preguntas y <b>${res.rows.length}</b> respuestas.<br><button class="btn or" id="csvGo" style="margin-top:8px">📥 Insertar ${res.rows.length} respuestas</button>`:`❌ No se reconocieron respuestas. Revisen que la primera fila tenga las preguntas (usen la plantilla).`;};
  const f=$('#capForm'); if(f) f.onsubmit=e=>{e.preventDefault(); const fd=new FormData(f); const answers={}; let any=false;
    sv.questions.forEach(q=>{ if(q.type==='multi'){const v=fd.getAll(q.id); if(v.length){answers[q.id]=v;any=true;}} else {const v=fd.get(q.id); if(v!==null&&String(v).trim()!==''){answers[q.id]=q.type==='scale'?Number(v):String(v).trim();any=true;}} });
    if(!any){toast('Marquen al menos una respuesta');return;}
    const k='r_'+uid(); T(tid).blocks[k]={answers,by:ME.name||'',place:String(fd.get('_lugar')||'').trim(),ts:Date.now(),updatedAt:0};
    touchBlock(tid,k,{log:'✍️ Capturó una respuesta de la encuesta'}); toast(`💾 Respuesta ${responses(tid).length} guardada`); f.reset(); window.scrollTo({top:0,behavior:'smooth'}); render();
  };
};

function csvCell(v){v=String(v??'');return /[",\n\r;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')}
function parseCSV(t){t=t.replace(/^\ufeff/,'');const first=t.split(/\r?\n/)[0]||'';const d=[',',';','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}else if(c==='"')q=true;else if(c===d){row.push(cur);cur='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}else cur+=c;}
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^\s*\d+[.)-]\s*/,'').replace(/[^a-z0-9]+/g,' ').trim();
function importCSV(txt,sv){const rows=parseCSV(txt);if(rows.length<2)return{rows:[],mapped:0};const H=rows[0].map(nrm);const col={};
  sv.questions.forEach(q=>{const nq=nrm(q.q);let j=H.findIndex(h=>h===nq);if(j<0)j=H.findIndex(h=>h.length>5&&(h.includes(nq)||nq.includes(h)));if(j>=0)col[q.id]=j;});
  const out=[];rows.slice(1).forEach(r=>{const a={};sv.questions.forEach(q=>{const j=col[q.id];if(j==null)return;const cell=(r[j]||'').trim();if(!cell)return;const nc=nrm(cell);
    if(q.type==='single'){const o=q.opts.find(o=>nrm(o)===nc)||q.opts.find(o=>nc&&(nc.includes(nrm(o))||nrm(o).includes(nc)));if(o)a[q.id]=o;}
    else if(q.type==='multi'){const sel=q.opts.filter(o=>nc.includes(nrm(o)));if(sel.length)a[q.id]=sel;}
    else if(q.type==='scale'){const v=parseInt(cell);if(v>=1&&v<=5)a[q.id]=v;}
    else a[q.id]=cell;});if(Object.keys(a).length)out.push(a);});
  return{rows:out,mapped:Object.keys(col).length}}

async function refreshAllFromCloud(){
  if(!CLOUD.on){toast('Modo dispositivo: solo se ven los equipos guardados en esta computadora o importados.');return;}
  toast('🔄 Leyendo la nube…');
  for(const t of S.config.teams){ try{ const qs=await CLOUD.db.collection(`teams/${t.id}/blocks`).get(); const tt=T(t.id); qs.docs.forEach(d=>{const r=d.data();const l=tt.blocks[d.id];if(!l||(r.updatedAt||0)>=(l.updatedAt||0)) tt.blocks[d.id]=clone(r);}); const g=await CLOUD.db.doc(`grades/${t.id}`).get(); if(g.exists){const r=g.data(); if(!S.grades[t.id]||(r.updatedAt||0)>=(S.grades[t.id].updatedAt||0)) S.grades[t.id]=clone(r);} const rp=await CLOUD.db.collection(`teams/${t.id}/reports`).orderBy('ts','desc').limit(40).get(); if(rp.size){const ids=new Set(tt.reports.map(r=>r.id)); rp.docs.forEach(d=>{if(!ids.has(d.id)) tt.reports.push({...d.data(),synced:true});}); tt.reports.sort((a,b)=>b.ts-a.ts);} }catch(e){} }
  lsSet(LS,S); if(VIEW==='docente'){$('#overview').innerHTML=overviewTable();} toast('✔️ Avance actualizado');
}

  $('#main').oninput=e=>{const el=e.target;if(el.dataset.gc){const g=ensure();g.comments=g.comments||{};g.comments[el.dataset.gc]=el.value;saveGrade(DOCT);} if(el.id==='grGen'){ensure().general=el.value;saveGrade(DOCT);}};

function reshuffle(gid){
  const teams=S.config.teams.filter(t=>t.group===gid); const gg=groupById(gid); const all=[...teams.flatMap(t=>t.members),...(gg.pool||[])]; gg.pool=[];
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  teams.forEach(t=>t.members=[]); all.forEach((m,i)=>teams[i%teams.length].members.push(m));
  saveConfig(); toast('🎲 Equipos reorganizados'); render();
}

async function downloadFile(name,data,mime){
  if(!(window.claude&&typeof window.claude.use==='function')){ try{ const u=URL.createObjectURL(new Blob([data],{type:mime+';charset=utf-8'})); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),3000); toast('⬇️ Descargado: '+name); return; }catch(e){} }
  try{ const dl=window.claude&&await window.claude.use('downloads'); if(dl){ try{ await dl.save({filename:name,data:new Blob([data],{type:mime})}); toast('⬇️ Descarga lista'); return; }catch(e){ if(e&&/declin|cancel/i.test(String(e.message||e.code))) return; try{await dl.save({filename:name,data});toast('⬇️ Descarga lista');return;}catch(e2){} } } }catch(e){}
  modal(`<h2>📋 Copia este contenido</h2><p class="muted">Tu navegador no permite descargar desde aquí. Copia el contenido y pégalo en un archivo llamado <b>${esc(name)}</b> (o envíalo a tu profesora).</p><textarea id="mTxt" style="min-height:260px;font-family:monospace;font-size:.75rem">${esc(data)}</textarea><div class="row" style="margin-top:8px"><button class="btn or" id="mCp">Copiar</button><button class="btn gh" id="mNo">Cerrar</button></div>`,r=>{r.querySelector('#mCp').onclick=()=>copyText(r.querySelector('#mTxt').value);r.querySelector('#mNo').onclick=closeModal;});
}

      const mergeTeam=(tid,d)=>{const t=T(tid);Object.entries(d.blocks||{}).forEach(([k,v])=>{const l=t.blocks[k];if(!l||(v.updatedAt||0)>(l.updatedAt||0)){t.blocks[k]=v;touchBlock(tid,k);}});const lid=new Set(t.log.map(x=>x.id));(d.log||[]).forEach(x=>{if(!lid.has(x.id)){t.log.push({...x,synced:false});}});t.log.sort((a,b)=>b.ts-a.ts);const rid=new Set(t.reports.map(x=>x.id));(d.reports||[]).forEach(x=>{if(!rid.has(x.id)){const n={...x,synced:false};t.reports.push(n);if(CLOUD.on&&CLOUD.writable)CLOUD.db.collection(`teams/${tid}/reports`).doc(n.id).set(n).then(()=>n.synced=true).catch(()=>{});}});t.reports.sort((a,b)=>b.ts-a.ts);};
      if(o.kind==='canvaslab-team'){ if(o.team&&!teamById(o.tid)){S.config.teams.push(normalizeConfig({teams:[o.team],groups:[]}).teams[0]);saveConfig();} mergeTeam(o.tid,o.data); }
      else if(o.kind==='canvaslab-all'){ if(isTeacher()&&o.data.config&&(o.data.config.updatedAt||0)>(S.config.updatedAt||0)){S.config=normalizeConfig(o.data.config);saveConfig();} Object.entries(o.data.teams||{}).forEach(([tid,d])=>mergeTeam(tid,d)); if(isTeacher()) Object.entries(o.data.grades||{}).forEach(([tid,g])=>{if(!S.grades[tid]||(g.updatedAt||0)>(S.grades[tid].updatedAt||0)){S.grades[tid]=g;saveGrade(tid);}}); }
      else throw new Error('formato');
      persistLocal(); closeModal(); toast('📥 Respaldo importado'); render();
    }catch(e){toast('❌ Ese contenido no es un respaldo válido');}};
  });
}

/* ---------- TUTORIAL GUIADO ---------- */
const TOUR=[
 {i:'🐝',t:'¡Hola! Soy Kab, tu abeja coach',d:'En este laboratorio tu equipo va a diseñar el modelo de negocio de una empresa real de la región, como PAMASUR, El Yucateco, Sal Sol, Kekén, la miel orgánica maya o el Ingenio de Pucté. Te voy a guiar paso a paso.'},
 {i:'🔑',t:'1. Entra con la clave de tu equipo',d:'Toca “🔑 Entrar con la clave de mi equipo” arriba a la derecha, escribe la clave que te dio tu profesora y registra tu nombre la primera vez. Tu equipo ya tiene un caso asignado.'},
 {i:'📖',t:'2. Investiga el caso y aplica la encuesta',d:'En “El caso” están los datos verificados y las fuentes para investigar. En “📊 Encuesta” tienen un cuestionario listo: apliquen mínimo 20 y los resultados se grafican solos.'},
 {i:'🧩',t:'3. Llena el Canvas en orden 1 → 9',d:'Toca un bloque: a la izquierda APRENDES (explicación y ejemplo resuelto de un food truck) y a la derecha lo HACES con tu equipo en 4 pasos. Kab, la abeja, te revisa en vivo.'},
 {i:'✨',t:'4. Ideas propias + justificación',d:'Las propuestas ayudan a arrancar, pero la rúbrica premia las ideas propias del equipo y las justificaciones con datos. Asignen un responsable por bloque.'},
 {i:'🧮',t:'5. Números y patrón',d:'En “Números” comprueban si el modelo deja ganancia (margen, punto de equilibrio). En “Patrón e innovación” eligen su fórmula de ingresos y concluyen por qué ese modelo.'},
 {i:'💾',t:'6. Todo se guarda solo',d:'Cada cambio se guarda al instante y hay respaldos automáticos. Si cierras a la mitad, al volver sigues donde te quedaste. Al final: guarden la versión “Entrega final”, descarguen el PDF y súbanlo a Brightspace → Actividad 10.'}
];
function openTour(i){ i=i||0; const s=TOUR[i];
  modal(`<div class="tour-ill">${s.i}</div><h2 style="text-align:center">${esc(s.t)}</h2><p style="text-align:center;font-size:1.05rem">${esc(s.d)}</p><div class="dots">${TOUR.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div><div class="row" style="justify-content:space-between"><button class="btn gh" id="tPrev" ${i===0?'disabled':''}>⬅️ Anterior</button><button class="btn gh sm" id="tSkip">Saltar</button>${i<TOUR.length-1?`<button class="btn or" id="tNext">Siguiente ➡️</button>`:`<button class="btn or" id="tEnd">¡Empezar! 🚀</button>`}</div>`,r=>{
    const end=()=>{lsSet(LS_TOUR,1);closeModal();if(!ME.team)openWho();};
    r.querySelector('#tPrev').onclick=()=>openTour(i-1); r.querySelector('#tSkip').onclick=end;
    const n=r.querySelector('#tNext'); if(n) n.onclick=()=>openTour(i+1); const e=r.querySelector('#tEnd'); if(e) e.onclick=end;
  });
}

$('#whoBtn').onclick=()=>openWho();
$('#tourBtn').onclick=()=>openTour(0);

route();
if(!lsGet(LS_TOUR)) setTimeout(()=>openTour(0),400);
initCloud();
